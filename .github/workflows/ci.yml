name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: hf
          POSTGRES_PASSWORD: hf
          POSTGRES_DB: hf_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U hf -d hf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://hf:hf@localhost:55432/hf_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e "backend[server,worker,dev]"
      - name: Tests (excludes live and llm markers; includes the fixture scrub guard)
        working-directory: backend
        run: pytest
      - name: Migrations apply to a fresh database and match the models
        working-directory: backend
        env:
          PGPASSWORD: hf
        run: |
          psql -h localhost -p 55432 -U hf -d hf_test -c "CREATE DATABASE hf_migr"
          export DATABASE_URL=postgresql+psycopg://hf:hf@localhost:55432/hf_migr
          alembic upgrade head
          alembic check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: RTL guard (no physical direction classes, including src/components/ui)
        working-directory: .
        run: scripts/check-rtl.sh
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E (phone, tablet, desktop projects)
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image (no worker-only dependencies)
        run: docker build -f deploy/api.Dockerfile -t homefinder-api:ci .

  secrets-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No tracked .env files or raw scrape captures
        run: |
          if git ls-files | grep -E '(^|/)\.env$|/raw/'; then
            echo "tracked secret/raw file found"; exit 1
          fi
      - name: No API keys in tracked files
        run: |
          if git grep -nE 'sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}' -- . ':!.github/workflows/ci.yml'; then
            echo "possible API key committed"; exit 1
          fi
      - name: Fixtures are scrubbed (also run in the backend job)
        run: |
          pip install pytest
          pytest backend/tests/test_fixtures_scrubbed.py -p no:cacheprovider --noconftest -q
