name: homefinder-local
services:
  db:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_USER: hf, POSTGRES_PASSWORD: hf, POSTGRES_DB: homefinder }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U hf -d homefinder"], interval: 5s, retries: 20 }
  api:
    build: { context: .., dockerfile: deploy/api.Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://hf:hf@db:5432/homefinder
      PHOTOS_DIR: /data/photos
      SESSION_SECRET: local
      WORKER_TOKEN: local
    depends_on: { db: { condition: service_healthy } }
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ../web/dist:/usr/share/nginx/html:ro
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
